<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intel Sustainability Summit Check-In</title>
    <!-- Add Font Awesome CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Hero section with Intel branding -->
    <div class="hero">
      <div class="hero-content">
        <img src="img/intel-logo.svg" alt="Intel Logo" class="intel-logo" />
        <h1>Team Sustainability Summit</h1>
        <div class="hero-divider"></div>
        <p><i class="fas fa-leaf"></i> Company-wide Sustainability Summit</p>
      </div>
    </div>
    <!-- Attendance tracking -->
    <div class="attendance-tracker" aria-label="Summit attendance">
      <div class="attendance-header">
        <i class="fas fa-users"></i>
        Attendance: <span id="attendeeCount">0</span>/<span id="attendeeGoal"
          >50</span
        >
      </div>
      <div
        class="progress-container"
        role="progressbar"
        aria-label="Attendee check-ins"
        aria-valuemin="0"
        aria-valuemax="50"
        aria-valuenow="0"
        id="attendanceProgress"
      >
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <div
        id="goalCelebration"
        class="goal-celebration"
        role="status"
        aria-live="polite"
        hidden
      >
        <i class="fas fa-trophy" aria-hidden="true"></i>
        <span id="goalCelebrationText"></span>
      </div>
    </div>
    <div class="container">
      <!-- Feedback message -->
      <p id="greeting" role="status" aria-live="polite"></p>

      <!-- Check-in form -->
      <form class="check-in" id="checkInForm">
        <label for="attendeeName" class="form-label">Attendee Check-In</label>
        <div class="form-group">
          <div class="input-wrapper">
            <input
              type="text"
              id="attendeeName"
              name="attendeeName"
              placeholder="Employee full name"
              autocomplete="name"
              maxlength="80"
              required
            />
            <select id="teamSelect" name="team" required>
              <option value="" disabled selected>Select Team...</option>
              <option value="water">Team Water Wise</option>
              <option value="zero">Team Net Zero</option>
              <option value="power">Team Renewables</option>
            </select>
          </div>
          <button type="submit" id="checkInBtn">
            <i class="fas fa-user-check"></i> Check In
          </button>
        </div>
      </form>

      <!-- Team stats -->
      <div class="team-stats">
        <h3>Team turnout</h3>
        <div class="teams-grid">
          <div class="team-card water" id="waterTeamCard">
            <span class="team-name">
              <span class="team-emoji" id="waterTeamEmoji" aria-hidden="true"
                >🌊</span
              >
              Team Water Wise
            </span>
            <span class="team-count" id="waterCount">0</span>
          </div>
          <div class="team-card zero" id="zeroTeamCard">
            <span class="team-name">
              <span class="team-emoji" id="zeroTeamEmoji" aria-hidden="true"
                >🌿</span
              >
              Team Net Zero
            </span>
            <span class="team-count" id="zeroCount">0</span>
          </div>
          <div class="team-card power" id="powerTeamCard">
            <span class="team-name">
              <span class="team-emoji" id="powerTeamEmoji" aria-hidden="true"
                >⚡</span
              >
              Team Renewables
            </span>
            <span class="team-count" id="powerCount">0</span>
          </div>
        </div>
      </div>

      <section class="attendee-section" aria-labelledby="attendeeHeading">
        <div class="attendee-heading">
          <div>
            <p class="section-kicker">SUMMIT PASSPORT</p>
            <h2 id="attendeeHeading">Checked-in attendees</h2>
          </div>
          <button type="button" id="clearAttendeesBtn" class="clear-button">
            <i class="fas fa-trash-can" aria-hidden="true"></i> Clear roster
          </button>
        </div>
        <ul id="attendeeList" class="attendee-list" aria-live="polite"></ul>
        <p id="emptyRoster" class="empty-roster">No one has checked in yet.</p>
      </section>
    </div>

    <footer class="footer">
      &copy; 2025 Intel |
      <a
        href="https://www.intel.com/content/www/us/en/corporate-responsibility/2030-goals.html"
        class="footer-link"
        >Sustainability Goals</a
      >
    </footer>

    <script src="script.js"></script>
  </body>
</html>
